[project]
name = "twitter"
description = "X/Twitter API v2 CLI for users, follows, posts, search, timelines, and lists"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [{type = "http", name = "X_API_KEY", match_headers = ["Authorization"], hosts = ["api.x.com"]}]
